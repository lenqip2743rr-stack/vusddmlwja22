<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>편의점 구비 품목 요청함</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts (Noto Sans KR) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #f3f0ff;
    }
    /* 편의점 진열대 선반 모양 커스텀 스타일 */
    .shelf-border {
      border-bottom: 6px solid #6d28d9;
      box-shadow: 0 4px 6px -1px rgba(109, 40, 217, 0.2);
    }
    .shelf-card {
      background: #ffffff;
      border: 2px solid #ddd6fe;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.08);
      position: relative;
    }
    .shelf-tag {
      background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
    }
    /* 터치 피드백 트랜지션 */
    .active-scale:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body class="min-h-screen pb-10 text-gray-800">

  <!-- 상단 편의점 간판 헤더 -->
  <header class="bg-gradient-to-r from-purple-900 via-purple-700 to-indigo-800 text-white shadow-lg sticky top-0 z-50 shelf-border">
    <div class="max-w-md mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="text-2xl animate-bounce">🏪</span>
        <div>
          <h1 class="text-lg font-extrabold tracking-tight text-purple-100">편의점 구비 품목 요청함</h1>
          <p class="text-xs text-purple-200">필요한 물품이나 빈 진열대를 신고해 주세요!</p>
        </div>
      </div>
      <button onclick="loadReports()" title="새로고침" class="p-2 bg-purple-600 hover:bg-purple-500 rounded-full text-xs font-semibold shadow active-scale flex items-center justify-center w-8 h-8">
        🔄
      </button>
    </div>
  </header>

  <!-- 메인 컨테이너 -->
  <main class="max-w-md mx-auto px-4 pt-5 space-y-6">

    <!-- 토스트 알림 메시지 (팝업 창 대체) -->
    <div id="toast" class="hidden fixed top-16 left-1/2 -translate-x-1/2 z-50 w-11/12 max-w-sm px-4 py-3 rounded-xl text-white font-medium text-sm text-center shadow-xl transition-all duration-300">
      <span id="toast-message">알림</span>
    </div>

    <!-- 신고/요청 폼 카드 (진열장 스타일) -->
    <section class="shelf-card rounded-2xl p-5">
      <!-- 진열대 라벨 띠 -->
      <div class="absolute -top-3 left-4 shelf-tag text-white text-xs px-3 py-1 rounded-full font-bold shadow-md flex items-center gap-1">
        <span>🛒</span> 새로운 요청 등록
      </div>

      <form id="reportForm" class="mt-2 space-y-4" onsubmit="handleFormSubmit(event)">

        <!-- 1. 유형 선택 (버튼 칩 형태) -->
        <div>
          <label class="block text-xs font-bold text-purple-900 mb-2">1. 물품 유형을 선택해 주세요 <span class="text-red-500">*</span></label>
          <div class="grid grid-cols-4 gap-2" id="typeContainer">
            <button type="button" onclick="selectType('음료')" class="type-btn py-2.5 px-1 rounded-xl border-2 border-purple-200 bg-purple-50 text-purple-900 text-xs font-bold text-center transition-all flex flex-col items-center gap-1 active-scale active" data-value="음료">
              <span class="text-base">🥤</span>
              <span>음료</span>
            </button>
            <button type="button" onclick="selectType('식품')" class="type-btn py-2.5 px-1 rounded-xl border-2 border-purple-200 bg-white text-gray-600 text-xs font-bold text-center transition-all flex flex-col items-center gap-1 active-scale" data-value="식품">
              <span class="text-base">🍱</span>
              <span>식품</span>
            </button>
            <button type="button" onclick="selectType('생필품')" class="type-btn py-2.5 px-1 rounded-xl border-2 border-purple-200 bg-white text-gray-600 text-xs font-bold text-center transition-all flex flex-col items-center gap-1 active-scale" data-value="생필품">
              <span class="text-base">🧻</span>
              <span>생필품</span>
            </button>
            <button type="button" onclick="selectType('기타')" class="type-btn py-2.5 px-1 rounded-xl border-2 border-purple-200 bg-white text-gray-600 text-xs font-bold text-center transition-all flex flex-col items-center gap-1 active-scale" data-value="기타">
              <span class="text-base">📦</span>
              <span>기타</span>
            </button>
          </div>
          <input type="hidden" id="selectedType" value="음료">
        </div>

        <!-- 2. 장소 / 위치 입력 -->
        <div>
          <label for="locationInput" class="block text-xs font-bold text-purple-900 mb-1.5">
            2. 위치 / 진열대 구역 <span class="text-red-500">*</span>
          </label>
          <input type="text" id="locationInput" placeholder="예: 음료 냉장고 2번 칸, 입구 오른쪽 매대"
            class="w-full px-3.5 py-2.5 rounded-xl border border-purple-200 text-sm focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-transparent bg-purple-50/30 transition-all placeholder:text-gray-400">
        </div>

        <!-- 3. 내용 입력 -->
        <div>
          <label for="contentInput" class="block text-xs font-bold text-purple-900 mb-1.5">
            3. 요청 / 신고 내용 <span class="text-red-500">*</span>
          </label>
          <textarea id="contentInput" rows="3" placeholder="예: 포카리스웨트 500ml 재고가 비어있어요. 입고해 주세요!"
            class="w-full px-3.5 py-2.5 rounded-xl border border-purple-200 text-sm focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-transparent bg-purple-50/30 transition-all placeholder:text-gray-400 resize-none"></textarea>
        </div>

        <!-- 안내 문구 (익명 안내) -->
        <p class="text-[11px] text-purple-600 font-medium flex items-center gap-1">
          🔒 개인정보(이름, 학번, 연락처)는 일절 수집하지 않는 익명 요청입니다.
        </p>

        <!-- 제출 버튼 -->
        <button type="submit" id="submitBtn" 
          class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-purple-700 to-indigo-700 text-white font-bold text-base shadow-lg shadow-purple-300 hover:from-purple-800 hover:to-indigo-800 transition-all active-scale flex items-center justify-center gap-2">
          <span>신고 / 요청 제출하기</span>
          <span>✨</span>
        </button>

      </form>
    </section>

    <!-- 최근 요청 현황 (진열장 목록 스타일) -->
    <section class="space-y-3">
      <div class="flex items-center justify-between px-1">
        <h2 class="text-sm font-extrabold text-purple-950 flex items-center gap-1.5">
          <span>📋</span>
          <span>최근 요청 목록</span>
          <span id="reportCount" class="text-xs bg-purple-200 text-purple-800 px-2 py-0.5 rounded-full font-bold">0</span>
        </h2>
        <span class="text-[11px] text-purple-500 font-medium">최신순 업데이트</span>
      </div>

      <!-- 리스트 로딩 스피너 -->
      <div id="loadingSpinner" class="py-8 text-center space-y-2">
        <div class="inline-block w-7 h-7 border-3 border-purple-600 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-xs text-purple-600 font-semibold">목록을 불러오는 중...</p>
      </div>

      <!-- 빈 목록 안내 -->
      <div id="emptyMessage" class="hidden shelf-card rounded-2xl p-8 text-center text-gray-500">
        <p class="text-3xl mb-1">🎁</p>
        <p class="text-xs font-semibold text-purple-800">아직 등록된 요청이 없습니다.</p>
        <p class="text-[11px] text-gray-400 mt-0.5">첫 번째 품목을 신고해 보세요!</p>
      </div>

      <!-- 요청 카드 목록 생성 위치 -->
      <div id="reportsList" class="space-y-3"></div>
    </section>

  </main>

  <!-- 프론트엔드 자바스크립트 로직 -->
  <script>
    // 카테고리 선택 처리
    function selectType(typeValue) {
      document.getElementById('selectedType').value = typeValue;
      const buttons = document.querySelectorAll('.type-btn');
      buttons.forEach(btn => {
        if (btn.getAttribute('data-value') === typeValue) {
          btn.classList.add('bg-purple-50', 'text-purple-900', 'border-purple-600');
          btn.classList.remove('bg-white', 'text-gray-600', 'border-purple-200');
        } else {
          btn.classList.remove('bg-purple-50', 'text-purple-900', 'border-purple-600');
          btn.classList.add('bg-white', 'text-gray-600', 'border-purple-200');
        }
      });
    }

    // 커스텀 토스트 메시지 띄우기 (alert 사용 안 함)
    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      const toastMessage = document.getElementById('toast-message');
      
      toastMessage.textContent = message;
      if (isError) {
        toast.className = "fixed top-16 left-1/2 -translate-x-1/2 z-50 w-11/12 max-w-sm px-4 py-3 rounded-xl text-white font-medium text-sm text-center shadow-xl transition-all duration-300 bg-red-600";
      } else {
        toast.className = "fixed top-16 left-1/2 -translate-x-1/2 z-50 w-11/12 max-w-sm px-4 py-3 rounded-xl text-white font-medium text-sm text-center shadow-xl transition-all duration-300 bg-purple-800";
      }
      
      toast.classList.remove('hidden');
      setTimeout(() => {
        toast.classList.add('hidden');
      }, 3000);
    }

    // 제출 폼 이벤트 핸들러
    function handleFormSubmit(e) {
      e.preventDefault();

      const type = document.getElementById('selectedType').value;
      const location = document.getElementById('locationInput').value.trim();
      const content = document.getElementById('contentInput').value.trim();

      // 유효성 검사: 장소와 내용 모두 필수
      if (!location) {
        showToast('위치/장소를 입력해 주세요.', true);
        document.getElementById('locationInput').focus();
        return;
      }

      if (!content) {
        showToast('요청/신고 내용을 입력해 주세요.', true);
        document.getElementById('contentInput').focus();
        return;
      }

      // 로딩 버튼 상태로 변경
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = `
        <div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
        <span>저장하는 중...</span>
      `;

      // 구글 앱스 스크립트 백엔드 함수 호출
      google.script.run
        .withSuccessHandler(function(response) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<span>신고 / 요청 제출하기</span><span>✨</span>`;

          if (response && response.success) {
            showToast(response.message || '접수되었습니다!');
            // 입력창 초기화
            document.getElementById('locationInput').value = '';
            document.getElementById('contentInput').value = '';
            // 목록 갱신
            renderReports(response.reports || []);
          } else {
            showToast((response && response.message) ? response.message : '저장에 실패했습니다.', true);
          }
        })
        .withFailureHandler(function(err) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<span>신고 / 요청 제출하기</span><span>✨</span>`;
          showToast('오류가 발생했습니다: ' + err.message, true);
        })
        .submitReport({ type: type, location: location, content: content });
    }

    // 최근 신고 목록 불러오기
    function loadReports() {
      const spinner = document.getElementById('loadingSpinner');
      const emptyMsg = document.getElementById('emptyMessage');
      const listContainer = document.getElementById('reportsList');

      spinner.classList.remove('hidden');
      emptyMsg.classList.add('hidden');
      listContainer.innerHTML = '';

      google.script.run
        .withSuccessHandler(function(reports) {
          spinner.classList.add('hidden');
          renderReports(reports);
        })
        .withFailureHandler(function() {
          spinner.classList.add('hidden');
          showToast('목록을 가져오지 못했습니다.', true);
        })
        .getRecentReports();
    }

    // 신고 목록 화면 그려주기
    function renderReports(reports) {
      const emptyMsg = document.getElementById('emptyMessage');
      const listContainer = document.getElementById('reportsList');
      const countBadge = document.getElementById('reportCount');

      countBadge.textContent = reports ? reports.length : 0;
      listContainer.innerHTML = '';

      if (!reports || reports.length === 0) {
        emptyMsg.classList.remove('hidden');
        return;
      }

      emptyMsg.classList.add('hidden');

      reports.forEach(item => {
        // 유형별 아이콘 설정
        let icon = '📦';
        if (item.type === '음료') icon = '🥤';
        else if (item.type === '식품') icon = '🍱';
        else if (item.type === '생필품') icon = '🧻';

        // 상태값 뱃지 색상
        let statusBg = 'bg-amber-100 text-amber-800 border-amber-300';
        if (item.status === '완료' || item.status === '처리완료') {
          statusBg = 'bg-emerald-100 text-emerald-800 border-emerald-300';
        } else if (item.status === '확인중') {
          statusBg = 'bg-blue-100 text-blue-800 border-blue-300';
        } else if (item.status === '접수') {
          statusBg = 'bg-purple-100 text-purple-800 border-purple-300';
        }

        const card = document.createElement('div');
        card.className = 'shelf-card rounded-2xl p-4 transition-all hover:border-purple-400';
        card.innerHTML = `
          <div class="flex items-start justify-between gap-2 mb-2">
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="text-xs px-2 py-0.5 rounded-md bg-purple-100 text-purple-900 font-bold flex items-center gap-1">
                <span>${icon}</span>
                <span>${escapeHtml(item.type)}</span>
              </span>
              <span class="text-xs px-2 py-0.5 rounded-md border font-semibold ${statusBg}">
                ${escapeHtml(item.status)}
              </span>
            </div>
            <span class="text-[11px] font-medium text-gray-400 whitespace-nowrap">${escapeHtml(item.timestamp)}</span>
          </div>

          <div class="space-y-1 mt-2">
            <div class="text-xs font-bold text-gray-700 flex items-center gap-1">
              <span class="text-purple-600">📍</span>
              <span>${escapeHtml(item.location)}</span>
            </div>
            <p class="text-xs text-gray-800 leading-relaxed bg-purple-50/50 p-2.5 rounded-xl border border-purple-100/60">
              ${escapeHtml(item.content)}
            </p>
          </div>
        `;
        listContainer.appendChild(card);
      });
    }

    // HTML 특수문자 이스케이프 (보안 강화)
    function escapeHtml(text) {
      if (!text) return '';
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // 페이지 접속 시 초기 로드
    window.onload = function() {
      loadReports();
    };
  </script>
</body>
</html>
